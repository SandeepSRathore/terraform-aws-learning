spring.application.name=hello-springboot

# Every property can be overridden by an environment variable:
#   app.message -> APP_MESSAGE, server.port -> SERVER_PORT
# On EC2, Terraform writes those into /etc/<app>/app.env.
app.message=Hello from Spring Boot!
app.version=@project.version@
server.port=8080

# /actuator/health is what the bootstrap script and smoke test poll.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
